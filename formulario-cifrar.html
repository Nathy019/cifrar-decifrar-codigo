<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifra</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
    <!-- Link do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <h2>Cifra</h2>
        <form action="cifrar.php" method="POST">
            <label for="texto">Texto para cifrar:</label><br>
            <textarea name="texto" rows="4" cols="50" required></textarea><br><br>

            <label for="deslocamento">Número de deslocamento (3 a 25):</label><br>
            <input type="number" name="deslocamento" min="3" max="25" required><br><br>

            <input type="submit" value="Cifrar">
        </form>
    </div>

    <!-- Link do Bootstrap JS (se necessário) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
